<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4" />

  <!-- Center Badge -->
  <circle cx="256" cy="256" r="160" fill="#18181b" stroke="url(#primary-grad)" stroke-width="8" />

  <!-- Brand Symbol / BM Monogram -->
  <text x="256" y="295" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="140" font-weight="900" fill="url(#primary-grad)" text-anchor="middle" letter-spacing="-6">BM</text>

  <!-- Red Accent Dot / Cart Accent -->
  <circle cx="345" cy="210" r="18" fill="#ef4444" />
  <circle cx="345" cy="210" r="28" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6" />
</svg>

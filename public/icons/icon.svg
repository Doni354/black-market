<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="noury-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFCFB" />
      <stop offset="100%" stop-color="#EAF5F1" />
    </linearGradient>
    <linearGradient id="noury-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#47957F" />
      <stop offset="100%" stop-color="#3D8383" />
    </linearGradient>
    <linearGradient id="noury-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CDD272" />
      <stop offset="100%" stop-color="#B5BA54" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3D8383" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Base App Icon Frame -->
  <rect width="512" height="512" rx="112" fill="url(#noury-bg)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#CDE5DD" stroke-width="4" />

  <!-- Center Organic Circle -->
  <circle cx="256" cy="256" r="168" fill="url(#noury-primary)" filter="url(#soft-shadow)" />

  <!-- Fresh Citrus Leaf Accent Top Right -->
  <path d="M295 130 C345 130 375 165 375 210 C330 210 295 180 295 130 Z" fill="url(#noury-accent)" />
  <path d="M295 130 Q335 170 375 210" stroke="#FAFCFB" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.7" />

  <!-- Stylized Clean Bold 'N' for Noury -->
  <!-- Left Stem -->
  <rect x="180" y="195" width="34" height="135" rx="17" fill="#FFFFFF" />
  <!-- Right Stem -->
  <rect x="298" y="195" width="34" height="135" rx="17" fill="#FFFFFF" />
  <!-- Diagonal Bar -->
  <path d="M185 208 L318 318 C324 323 332 320 332 312 L332 292 L200 182 C194 177 185 180 185 188 Z" fill="#FFFFFF" />

  <!-- Playful Fresh Droplet Accent -->
  <circle cx="340" cy="305" r="16" fill="url(#noury-accent)" />
</svg>
